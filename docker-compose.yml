services:
  backend:
    build: ./backend
    container_name: obscura-backend
    env_file: ./backend/.env
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    container_name: obscura-frontend
    environment:
      API_TARGET: http://backend:5000
    ports:
      - "5173:5173"
    depends_on:
      - backend
